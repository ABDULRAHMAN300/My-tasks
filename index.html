<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مهامي</title>
<meta name="description" content="مهامي اليومية مرتبة بالأهمية مع وقت بداية اختياري ومزامنة بين الأجهزة">
<meta name="theme-color" content="#7C3AED">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مهامي">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{var __t=localStorage.getItem("mahami.theme");if(__t==="dark"||__t==="light")document.documentElement.setAttribute("data-theme",__t)}catch(e){}</script>
<style>
:root{
  --bg:#F5F0FF; --surface:#FFFFFF; --ink:#1E1536; --muted:#6B6389; --line:#E4DBF7;
  --brand:#7C3AED; --brand-d:#5B21B6; --brand-soft:#EDE4FF;
  --ok:#16A34A; --danger:#EF2D56;
  --radius:20px;
  --font:'Cairo','Geeza Pro','Segoe UI',Tahoma,system-ui,sans-serif;
}
:root[data-theme="dark"]{--bg:#120C24;--surface:#1E1538;--ink:#F3EEFF;--muted:#AEA5CC;--line:#35295A;--brand-soft:#2D1F55;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#120C24;--surface:#1E1538;--ink:#F3EEFF;--muted:#AEA5CC;--line:#35295A;--brand-soft:#2D1F55;color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
body{min-height:100vh;min-height:100dvh;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,#4C1D95 0%,#7C3AED 58%,#C026D3 125%);
  padding:calc(20px + env(safe-area-inset-top)) 0 30px;border-radius:0 0 32px 32px;
  box-shadow:0 14px 34px rgba(76,29,149,.32)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{width:220px;height:220px;left:-70px;top:-90px}
.hero::after{width:140px;height:140px;right:-40px;bottom:-70px}
.hero .wrap{position:relative;display:flex;align-items:center;gap:14px;z-index:1}
.hero-txt{flex:1;min-width:0}
.hero small{opacity:.9;font-size:.85rem;display:block;font-weight:500}
.hero h1{margin:0 0 4px;font-size:1.9rem;font-weight:800;line-height:1.25;letter-spacing:.2px}
.hero .sub{font-size:.95rem;opacity:.96;font-weight:500}
.ring{width:92px;height:92px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:rgba(255,255,255,.25)} .ring .fg{stroke:#fff;transition:stroke-dashoffset .5s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.3rem;font-weight:800}
.chip-sync{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:3px 12px;border-radius:99px;
  background:rgba(255,255,255,.2);font-size:.78rem;font-weight:600}
.chip-sync i{width:8px;height:8px;border-radius:50%;background:#D8CFF0}
.chip-sync.ok i{background:#4ADE80} .chip-sync.sync i{background:#FACC15} .chip-sync.err i{background:#FF8A9B}

/* date strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding:18px 16px 8px;margin:0 -16px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.day{flex:none;width:56px;padding:9px 0 8px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);
  text-align:center;scroll-snap-align:center;position:relative}
.day span{display:block;font-size:.74rem;color:var(--muted);font-weight:600}
.day b{display:block;font-size:1.2rem;line-height:1.4;font-weight:800}
.day.today b{color:var(--brand)}
.day.sel{background:linear-gradient(160deg,#7C3AED,#A855F7);border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(124,58,237,.35)}
.day.sel span,.day.sel b{color:#fff}
.day i{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--brand)}
.day.sel i{background:#fff}
.day-more{flex:none;width:56px;border-radius:18px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:1.3rem;position:relative;background:var(--surface)}
.day-more input{position:absolute;inset:0;opacity:0;width:100%;height:100%}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;background:var(--surface);
  border:1.5px solid var(--line);font-size:.88rem;font-weight:600;min-height:38px}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* sections */
.sec{margin-top:20px}
.sec-h{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:1rem;margin:0 0 10px;padding:4px 14px 4px 12px;
  border-radius:99px;color:var(--imp);background:color-mix(in srgb,var(--imp) 14%,transparent)}
.sec-h .dot{width:10px;height:10px;border-radius:50%;background:var(--imp)}
.sec-h em{font-style:normal;font-weight:700;font-size:.82rem;background:var(--imp);color:#fff;border-radius:99px;min-width:22px;text-align:center;padding:0 7px}
.task{display:flex;align-items:center;gap:12px;border-radius:var(--radius);padding:13px 12px 13px 10px;margin-bottom:11px;position:relative;overflow:hidden;cursor:pointer;
  background:color-mix(in srgb,var(--imp) 6%,var(--surface));
  border:1px solid color-mix(in srgb,var(--imp) 24%,var(--line));
  box-shadow:0 4px 14px color-mix(in srgb,var(--imp) 12%,transparent)}
.task::before{content:"";position:absolute;top:0;bottom:0;right:0;width:7px;background:var(--imp)}
.task .ti{flex:none;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:1.5rem;
  background:color-mix(in srgb,var(--ac) 20%,var(--surface));margin-right:8px;
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ac) 35%,transparent)}
.task .tb{flex:1;min-width:0}
.task .tt{font-weight:700;font-size:1.02rem;line-height:1.45;overflow-wrap:anywhere}
.task .tm{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:.78rem;color:var(--muted);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 10px;border-radius:99px;background:color-mix(in srgb,var(--ink) 7%,transparent);white-space:nowrap}
.tag.imp{background:var(--imp);color:#fff;font-weight:700}
.tag.time{background:var(--brand-soft);color:var(--brand);font-weight:800;font-variant-numeric:tabular-nums}
.tag.time.due{background:var(--danger);color:#fff}
.tag.late{background:#FFE3E8;color:#C0213C;font-weight:800}
:root[data-theme="dark"] .tag.late{background:#4A1F2B;color:#FF9AAE}
:root[data-theme="dark"] .tag.time{color:#C4A8FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.late{background:#4A1F2B;color:#FF9AAE}:root:not([data-theme="light"]) .tag.time{color:#C4A8FF}}
.chk{flex:none;width:46px;height:46px;display:grid;place-items:center}
.chk span{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--imp);display:grid;place-items:center;color:transparent;font-weight:800;transition:.15s;background:var(--surface)}
.task.done{opacity:.55}
.task.done .tt{text-decoration:line-through}
.task.done .chk span{background:var(--ok);border-color:var(--ok);color:#fff}
.toggle-done{width:100%;padding:11px;border-radius:16px;background:var(--surface);border:1.5px dashed var(--line);color:var(--muted);margin-top:6px;font-weight:600}
.empty{text-align:center;padding:46px 16px;color:var(--muted);font-weight:500}
.empty b{display:block;font-size:2.4rem;margin-bottom:6px}
.date-h{margin:22px 2px 10px;font-weight:800;color:var(--brand);font-size:1.02rem}

/* nav + fab */
.nav{position:fixed;inset:auto 0 0 0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:20}
.nav .in{display:flex;width:100%;max-width:560px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0;color:var(--muted);font-size:.76rem;min-height:54px;font-weight:600}
.nav button b{font-size:1.35rem;line-height:1.3}
.nav button.on{color:var(--brand);font-weight:800}
.fab{position:fixed;left:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;
  background:linear-gradient(135deg,#7C3AED,#C026D3);color:#fff;font-size:2.1rem;line-height:1;z-index:21;
  box-shadow:0 12px 26px rgba(124,58,237,.5);display:grid;place-items:center;font-weight:600}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,40,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;border-radius:28px 28px 0 0;
  padding:20px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.ring .fg{transition:none}}
.sheet h2{margin:0 0 12px;font-size:1.2rem;font-weight:800}
.lbl{display:block;font-size:.84rem;color:var(--muted);margin:16px 0 6px;font-weight:600}
.inp{width:100%;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);min-height:50px}
textarea.inp{min-height:76px;resize:vertical}
.err{color:var(--danger);font-size:.82rem;margin-top:4px;min-height:1em;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.seg.c3{grid-template-columns:repeat(3,1fr)}
.opt{padding:10px 4px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);font-size:.88rem;min-height:48px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.opt.on{border-color:var(--c,var(--brand));background:color-mix(in srgb,var(--c,var(--brand)) 18%,transparent);font-weight:800}
.opt .d{width:11px;height:11px;border-radius:50%;background:var(--c)}
.areas{display:flex;flex-wrap:wrap;gap:8px}
.area-opt{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg);min-height:44px;font-weight:600}
.area-opt.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);font-weight:800}
.row{display:flex;gap:10px;align-items:center}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);min-height:52px;font-weight:600}
.sw{width:48px;height:29px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--brand)} .sw.on::after{right:22px}
.hint{font-size:.78rem;color:var(--muted);margin-top:5px;font-weight:500}
.btns{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:13px;border-radius:16px;font-weight:800;min-height:52px;background:var(--bg);border:1.5px solid var(--line)}
.btn.pri{background:linear-gradient(135deg,#7C3AED,#A855F7);border-color:transparent;color:#fff}
.sheet .btns{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--surface);padding:12px 0 calc(8px + env(safe-area-inset-bottom));margin-top:14px;z-index:2}
.btn.del{flex:none;padding:13px 18px;color:var(--danger);border-color:var(--danger);background:transparent}
.btn.cal{flex:none;width:54px;padding:0;font-size:1.3rem}
.timebox{display:flex;align-items:center;gap:6px;direction:ltr}
.timebox select{width:auto;min-width:72px;min-height:44px;padding:6px 10px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.timebox b{font-weight:800}
.dateinp{direction:ltr;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
.icons,.colors{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.icons button{aspect-ratio:1;border-radius:12px;border:1.5px solid var(--line);font-size:1.2rem;background:var(--bg)}
.icons button.on{border-color:var(--brand);background:var(--brand-soft)}
.colors button{aspect-ratio:1;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--ink)}

/* next card */
.next{margin-top:16px;border-radius:22px;padding:14px 16px;color:#fff;position:relative;overflow:hidden;cursor:pointer;
  background:linear-gradient(135deg,var(--imp),color-mix(in srgb,var(--imp) 55%,#1E1536));box-shadow:0 10px 24px color-mix(in srgb,var(--imp) 35%,transparent)}
.next small{display:block;font-weight:700;opacity:.92;font-size:.8rem}
.next .nt{font-weight:800;font-size:1.12rem;line-height:1.4;margin:2px 0 8px;overflow-wrap:anywhere}
.next .nb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem;font-weight:700}
.next .nb span{background:rgba(255,255,255,.22);border-radius:99px;padding:1px 10px}
.next .nb button{margin-inline-start:auto;background:#fff;color:#1E1536;border-radius:12px;padding:6px 16px;font-weight:800;min-height:38px}
/* postpone + subs */
.pp{flex:none;width:40px;height:40px;border-radius:12px;font-size:1.1rem;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.subs{display:flex;flex-direction:column;gap:6px}
.stp{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);min-height:46px}
.stp .sc{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--brand);display:grid;place-items:center;color:transparent;font-weight:800;font-size:.9rem}
.stp.on .sc{background:var(--ok);border-color:var(--ok);color:#fff}
.stp.on .st{text-decoration:line-through;opacity:.6}
.stp .st{flex:1;overflow-wrap:anywhere;font-weight:600}
.stp .sx{flex:none;width:34px;height:34px;color:var(--danger);font-size:1.1rem}
.subadd{display:flex;gap:8px;margin-top:8px}
.subadd .inp{min-height:46px}
.subadd .btn{flex:none;width:54px;padding:0;min-height:46px;font-size:1.3rem}
/* search + stats */
.searchbox{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.kpi{border-radius:18px;padding:12px 6px;text-align:center;background:var(--surface);border:1px solid var(--line)}
.kpi b{display:block;font-size:1.5rem;font-weight:800;color:var(--brand);line-height:1.3}
.kpi span{font-size:.76rem;color:var(--muted);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:10px;direction:ltr}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--line);position:relative;overflow:hidden;min-height:4px}
.bar i u{position:absolute;inset:auto 0 0 0;background:linear-gradient(180deg,#A855F7,#7C3AED);display:block}
.bar span{font-size:.7rem;color:var(--muted);font-weight:700}
.bar.today span{color:var(--brand)}
.prow{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:600;font-size:.9rem}
.prow .pl{width:78px;flex:none}
.prow .pt{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.prow .pt u{display:block;height:100%;border-radius:99px;background:var(--c)}
.prow .pn{width:44px;flex:none;text-align:left;color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr}
.themeseg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nav button{font-size:.7rem}

/* settings */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:16px}
.card h3{margin:0 0 8px;font-size:1.05rem;font-weight:800}
.arow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.arow:last-of-type{border-bottom:0}
.arow .ti{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 20%,var(--surface))}
.arow span{flex:1;font-weight:600}
.link{color:var(--brand);font-weight:800;padding:8px}

/* banner + toast */
.banner{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;max-width:536px;margin:0 auto;z-index:60;display:none;
  background:var(--ink);color:var(--bg);border-radius:20px;padding:13px 15px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.banner.open{display:block}
.banner .bt{font-weight:800} .banner .bs{opacity:.88;font-size:.88rem}
.banner .bb{display:flex;gap:8px;margin-top:8px}
.banner button{padding:7px 16px;border-radius:12px;background:rgba(255,255,255,.16);color:inherit;font-size:.88rem;min-height:40px;font-weight:700}
.banner button.go{background:var(--brand);color:#fff}
.toast{position:fixed;bottom:calc(150px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:99px;font-size:.88rem;z-index:70;display:none;max-width:90%;font-weight:600}
.toast.open{display:block}
</style>
</head>
<body>
<div id="banner" class="banner" role="alert"></div>

<header class="hero">
  <div class="wrap">
    <div class="hero-txt">
      <small id="h-date"></small>
      <h1>مهامي</h1>
      <div class="sub" id="h-sub"></div>
      <span class="chip-sync" id="h-sync"><i></i><em id="h-sync-t" style="font-style:normal">محلي</em></span>
    </div>
    <div class="ring" id="h-ring" aria-hidden="true"></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<button class="fab" id="fab" aria-label="مهمة جديدة">+</button>
<nav class="nav" aria-label="التنقل">
  <div class="in">
    <button data-act="tab" data-v="today"><b>🗓️</b>اليوم</button>
    <button data-act="tab" data-v="upcoming"><b>⏭️</b>القادمة</button>
    <button data-act="tab" data-v="search"><b>🔍</b>بحث</button>
    <button data-act="tab" data-v="stats"><b>📊</b>إحصائيات</button>
    <button data-act="tab" data-v="settings"><b>⚙️</b>الإعدادات</button>
  </div>
</nav>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
/* ============ ثوابت ============ */
const SB_URL='https://dwsyctxhfbuzpcjilmwq.supabase.co';
const SB_KEY='sb_publishable_xDrnFMfYxuqI008QnSZ8yA_JoKKMqzg'; // مفتاح عام مخصص للواجهات، والحماية عبر RLS
const LS='mahami.v1';
const IMP=[
  {v:1,name:'عاجل',c:'#EF2D56',ic:'🔥'},
  {v:2,name:'هام',c:'#FF8A00',ic:'⚡'},
  {v:3,name:'عادي',c:'#2563EB',ic:'🔹'}

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};

/* التاريخ: DD/MM/YYYY — الوقت: 24 ساعة HH:MM */
const fmtDMY=s=>{if(!s)return'';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`};
const parseDMY=t=>{
  const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec((t||'').trim());if(!m)return null;
  const d=+m[1],mo=+m[2],y=+m[3];if(y<2000||y>2100)return null;
  const dt=new Date(y,mo-1,d);
  return (dt.getFullYear()===y&&dt.getMonth()===mo-1&&dt.getDate()===d)?`${y}-${pad(mo)}-${pad(d)}`:null;
};
const fmtTime=t=>t||'';
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};

}

/* ============ منطق التكرار والترتيب ============ */
const isRep=t=>t.repeat&&t.repeat.type&&t.repeat.type!=='none';
function occursOn(t,d){
  if(t.del)return false;
  if(!isRep(t))return t.date===d;
  if(d<t.date)return false;
  const r=t.repeat,dt=parse(d);
  if(r.type==='daily')return true;
  if(r.type==='weekly')return (r.days&&r.days.length?r.days:[parse(t.date).getDay()]).includes(dt.getDay());
  if(r.type==='monthly')return dt.getDate()===parse(t.date).getDate();
  return false;
}
const isDone=(t,d)=>isRep(t)?(t.doneDates||[]).includes(d):!!t.done;
function itemsFor(d){
  const out=[];
  const td=today();
  for(const t of S.tasks){
    if(t.del)continue;
    if(occursOn(t,d))out.push({t,d,late:0});
    else if(d===td&&!isRep(t)&&!t.done&&t.date<td)out.push({t,d:t.date,late:diffDays(td,t.date)});
  }
  return out;
}
function sortItems(a,b){
  const ia=impOf(a.t),ib=impOf(b.t);
  if(ia!==ib)return ia-ib;
  if(!!a.late!==!!b.late)return a.late?-1:1;
  const ta=a.t.time||'',tb=b.t.time||'';
  if(!!ta!==!!tb)return ta?-1:1;
  if(ta!==tb)return ta<tb?-1:1;
  return (a.t.cts||0)-(b.t.cts||0);
}

function taskCard(it){
  const {t,d,late}=it,a=areaOf(t.areaId),imp=IMP.find(i=>i.v===impOf(t))||IMP[2];
  const done=isDone(t,d);
  const due=t.time&&!late&&d===today()&&!done&&t.time<=nowHM();
  const tags=[`<span class="tag imp">${imp.ic} ${imp.name}</span>`];
  if(it.sd)tags.push(`<span class="tag">📅 ${fmtDMY(t.date)}</span>`);
  if(late)tags.push(`<span class="tag late">متأخرة ${late===1?'منذ يوم':late===2?'منذ يومين':'منذ '+late+' أيام'}</span>`);
  if(t.time&&!late)tags.push(`<span class="tag time${due?' due':''}">⏰ ${fmtTime(t.time)}</span>`);
  tags.push(`<span class="tag">${esc(a.icon)} ${esc(a.name)}</span>`);
  const subs=t.subs||[];if(subs.length)tags.push(`<span class="tag">☑️ ${subs.filter(x=>x.d).length}/${subs.length}</span>`);
  if(t.note)tags.push(`<span class="tag">📝</span>`);
  if(isRep(t))tags.push(`<span class="tag">🔁 ${t.repeat.type==='daily'?'يومي':t.repeat.type==='weekly'?'أسبوعي':'شهري'}</span>`);
  return `<div class="task${done?' done':''}" data-act="edit" data-id="${esc(t.id)}" style="--ac:${safeColor(a.color)};--imp:${imp.c}">
    <div class="ti">${esc(a.icon)}</div>
    <div class="tb"><div class="tt">${esc(t.title)}</div><div class="tm">${tags.join('')}</div></div>
    ${(!isRep(t)&&!done)?`<button class="pp" data-act="postpone" data-id="${esc(t.id)}" aria-label="تأجيل إلى تاريخ">📆</button>`:''}
    <button class="chk" data-act="toggle" data-id="${esc(t.id)}" data-d="${d}" aria-label="${done?'إلغاء الإنجاز':'تم الإنجاز'}"><span>✓</span></button>
  </div>`;
}
function groupHTML(items,showDone){
  if(!items.length)return '';
  const open=items.filter(i=>!isDone(i.t,i.d)).sort(sortItems);
  const done=items.filter(i=>isDone(i.t,i.d)).sort(sortItems);
  let h='';
  for(const imp of IMP){
    const g=open.filter(i=>impOf(i.t)===imp.v);
    if(!g.length)continue;
    h+=`<section class="sec" style="--imp:${imp.c}"><div class="sec-h"><span class="dot"></span>${imp.ic} ${imp.name}<em>${g.length}</em></div>${g.map(taskCard).join('')}</section>`;
  }
  if(done.length){
    h+=`<section class="sec"><button class="toggle-done" data-act="showdone">${showDone?'إخفاء':'عرض'} المنجزة (${done.length})</button>${showDone?'<div style="margin-top:10px">'+done.map(taskCard).join('')+'</div>':''}</section>`;
  }
  return h;
}
function nextCard(items){
  const open=items.filter(i=>!isDone(i.t,i.d));
  if(open.length<2)return '';
  const hm=nowHM();
  const timed=open.filter(i=>!i.late&&i.t.time&&i.t.time>=hm).sort((a,b)=>a.t.time<b.t.time?-1:a.t.time>b.t.time?1:impOf(a.t)-impOf(b.t));
  const it=timed[0]||open.sort(sortItems)[0];
  const imp=IMP.find(i=>i.v===impOf(it.t))||IMP[2],a=areaOf(it.t.areaId);
  const label=timed[0]?`⏭️ المهمة التالية · الساعة ${it.t.time}`:'🎯 الأولى بالإنجاز الآن';
  return `<div class="next" data-act="edit" data-id="${esc(it.t.id)}" style="--imp:${imp.c}"><small>${label}</small>
    <div class="nt">${esc(it.t.title)}</div>
    <div class="nb"><span>${imp.ic} ${imp.name}</span><span>${esc(a.icon)} ${esc(a.name)}</span><button data-act="toggle" data-id="${esc(it.t.id)}" data-d="${it.d}">تم ✓</button></div></div>`;
}
function viewToday(){

    <div class="card"><h3>🧮 الآن</h3><div class="prow"><span class="pl" style="width:auto;flex:1">⏰ متأخرة غير منجزة</span><b style="color:${late?'var(--danger)':'var(--ok)'}">${late}</b></div>

  const c={...t};

    const set=new Set(c.doneDates||[]);
    set.has(d)?set.delete(d):set.add(d);
    c.doneDates=[...set].sort().slice(-400);
  }else c.done=!c.done;
  putTask(c);
}

function dlFile(name,mime,text){
  const blob=new Blob([text],{type:mime});
  const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
  if(isIOS&&navigator.canShare&&window.File){
    const f=new File([blob],name,{type:mime});
    if(navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
const liveTasks=()=>S.tasks.filter(t=>!t.del).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:sortItems({t:a,late:0},{t:b,late:0}));
function exportCSV(){
  const q=v=>{let x=String(v==null?'':v);if(/^[=+\-@]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};
  const rows=[['العنوان','المجال','الأهمية','التاريخ','الوقت','التكرار','الحالة','الخطوات','ملاحظة']];
  for(const t of liveTasks()){
    const imp=IMP.find(i=>i.v===impOf(t)).name;
    const rp=isRep(t)?({daily:'يومي',weekly:'أسبوعي',monthly:'شهري'}[t.repeat.type]):'';
    const st=isRep(t)?`متكررة (أُنجزت ${(t.doneDates||[]).length} مرة)`:(t.done?'منجزة':'غير منجزة');
    rows.push([t.title,areaOf(t.areaId).name,imp,fmtDMY(t.date),t.time||'',rp,st,(t.subs||[]).map(x=>(x.d?'[x] ':'[ ] ')+x.t).join(' | '),t.note||'']);
  }
  dlFile('mahami-tasks.csv','text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'));
  toast('تم تجهيز ملف CSV');
}
function icsFold(line){
  const enc=new TextEncoder(),out=[];let cur='',len=0;
  for(const ch of line){const b=enc.encode(ch).length;if(len+b>72){out.push(cur);cur=' '+ch;len=1+b}else{cur+=ch;len+=b}}
  out.push(cur);return out.join('\r\n');
}
function exportICS(){
  const e=x=>String(x||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mahami//AR','CALSCALE:GREGORIAN','X-WR-CALNAME:مهامي'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  let n=0;
  for(const t of liveTasks()){
    if(!isRep(t)&&t.done)continue;
    const a=areaOf(t.areaId),ymd8=t.date.replace(/-/g,'');
    L.push('BEGIN:VEVENT','UID:'+t.id+'@mahami',`DTSTAMP:${stamp}`);
    if(t.time)L.push(`DTSTART:${ymd8}T${t.time.replace(':','')}00`);else L.push(`DTSTART;VALUE=DATE:${ymd8}`);
    L.push('SUMMARY:'+e(t.title));
    const desc=[IMP.find(i=>i.v===impOf(t)).name+' · '+a.name,...(t.subs||[]).map(x=>(x.d?'☑ ':'☐ ')+x.t),t.note].filter(Boolean).join('\n');
    L.push('DESCRIPTION:'+e(desc));
    L.push('PRIORITY:'+({1:1,2:5,3:9}[impOf(t)]));
    if(t.repeat&&t.repeat.type==='daily')L.push('RRULE:FREQ=DAILY');
    else if(t.repeat&&t.repeat.type==='weekly'){const c=['SU','MO','TU','WE','TH','FR','SA'],ds=(t.repeat.days&&t.repeat.days.length?t.repeat.days:[parse(t.date).getDay()]);L.push('RRULE:FREQ=WEEKLY;BYDAY='+ds.map(i=>c[i]).join(','))}
    else if(t.repeat&&t.repeat.type==='monthly')L.push('RRULE:FREQ=MONTHLY');
    if(t.time)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e(t.title),'TRIGGER:PT0M','END:VALARM');
    L.push('END:VEVENT');n++;
  }
  L.push('END:VCALENDAR');
  dlFile('mahami-tasks.ics','text/calendar;charset=utf-8',L.map(icsFold).join('\r\n')+'\r\n');
  toast(n?`تم تجهيز ${n} مهمة في ملف ICS`:'لا مهام غير منجزة للتصدير');
}

/* ============ المزامنة (Supabase) ============ */
let sb=null,session=null,syncState='local',pushing=false,channel=null;
const taskToRow=t=>({id:t.id,date:t.date,title:t.title,note:t.note||'',area_id:t.areaId||null,importance:impOf(t),
  start_time:t.time||null,done:!!t.done,repeat:{...(t.repeat||{type:'none'}),subs:t.subs||[]},done_dates:t.doneDates||[],deleted:!!t.del,cts:t.cts||0,ts:t.ts||0});
const rowToTask=r=>({id:r.id,date:r.date,title:r.title,note:r.note||'',areaId:r.area_id,imp:r.importance,time:r.start_time,
  done:!!r.done,repeat:(({subs,...x})=>x)(r.repeat||{type:'none'}),subs:Array.isArray((r.repeat||{}).subs)?r.repeat.subs:[],doneDates:r.done_dates||[],del:!!r.deleted,cts:Number(r.cts)||0,ts:Number(r.ts)||0});
const areaToRow=a=>({id:a.id,name:a.name,icon:a.icon,color:a.color,sort:a.sort||0,deleted:!!a.del,ts:a.ts||0});
const rowToArea=r=>({id:r.id,name:r.name,icon:r.icon,color:r.color,sort:r.sort||0,del:!!r.deleted,ts:Number(r.ts)||0});
function setSync(s){syncState=s;renderSync()}

function mergeRemote(kind,remote){ // kind: 'a' | 't'
  const list=kind==='a'?S.areas:S.tasks,conv=kind==='a'?rowToArea:rowToTask;
  const r=conv(remote),i=list.findIndex(x=>x.id===r.id);
  if(i<0){list.push(r);return true}
  if(r.ts>list[i].ts){list[i]=r;delete S.dirty[kind][r.id];return true}
  if(r.ts<list[i].ts)S.dirty[kind][r.id]=1;
  return false;
}
async function pull(){
  const [a,t]=await Promise.all([sb.from('mahami_areas').select('*'),sb.from('mahami_tasks').select('*')]);
  if(a.error)throw a.error;if(t.error)throw t.error;
  const ra=new Set(a.data.map(r=>r.id)),rt=new Set(t.data.map(r=>r.id));
  a.data.forEach(r=>mergeRemote('a',r));t.data.forEach(r=>mergeRemote('t',r));
  S.areas.forEach(x=>{if(!ra.has(x.id))S.dirty.a[x.id]=1});
  S.tasks.forEach(x=>{if(!rt.has(x.id))S.dirty.t[x.id]=1});
  save();
}
async function push(){
  if(!sb||!session||pushing)return;
  const da=S.areas.filter(x=>S.dirty.a[x.id]),dt=S.tasks.filter(x=>S.dirty.t[x.id]);
  if(!da.length&&!dt.length)return;
  pushing=true;setSync('sync');
  try{
    if(da.length){const {error}=await sb.from('mahami_areas').upsert(da.map(areaToRow),{onConflict:'id'});if(error)throw error;
      da.forEach(x=>{const c=S.areas.find(y=>y.id===x.id);if(c&&c.ts===x.ts)delete S.dirty.a[x.id]})}
    for(let i=0;i<dt.length;i+=200){
      const part=dt.slice(i,i+200);
      const {error}=await sb.from('mahami_tasks').upsert(part.map(taskToRow),{onConflict:'id'});if(error)throw error;
      part.forEach(x=>{const c=S.tasks.find(y=>y.id===x.id);if(c&&c.ts===x.ts)delete S.dirty.t[x.id]});
    }
    save();setSync('ok');
  }catch(e){console.warn('push',e);setSync('err')}
  finally{pushing=false}
  if(S.areas.some(x=>S.dirty.a[x.id])||S.tasks.some(x=>S.dirty.t[x.id])){if(syncState==='ok')setTimeout(push,300)}
}
async function startSync(){
  if(!sb||!session)return;
  if(S.owner&&S.owner!==session.user.id){ // حساب مختلف على نفس الجهاز: لا نخلط البيانات
    S={owner:null,areas:DEFAULT_AREAS.map(a=>({...a,del:false,ts:0})),tasks:[],dirty:{a:{},t:{}},lastArea:'a-job'};
  }
  S.owner=session.user.id;save();
  setSync('sync');
  try{await pull();render();await push();if(syncState!=='err')setSync('ok');subscribe()}
  catch(e){console.warn('sync',e);setSync('err')}
}
function subscribe(){
  if(channel){try{sb.removeChannel(channel)}catch(e){}channel=null}
  channel=sb.channel('mahami-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'mahami_tasks'},p=>{if(p.new&&p.new.id&&mergeRemote('t',p.new)){save();render(true)}})
    .on('postgres_changes',{event:'*',schema:'public',table:'mahami_areas'},p=>{if(p.new&&p.new.id&&mergeRemote('a',p.new)){save();render(true)}})
    .subscribe();
}
function initSB(){
  if(!window.supabase){setSync('local');return}
  try{
    sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  }catch(e){console.warn(e);sb=null;return}
  sb.auth.onAuthStateChange((ev,s)=>{
    session=s;
    if(ev==='PASSWORD_RECOVERY'){V.tab='settings';toast('اكتب كلمة المرور الجديدة ثم احفظها')}
    if(s)setTimeout(startSync,0);
    else{if(channel){try{sb.removeChannel(channel)}catch(e){}channel=null}setSync('local')}
    render();
  });
}
async function authDo(kind){
  const email=($('em')||{}).value,pw=($('pw')||{}).value,er=$('auth-err');
  if(!email||!pw){er.textContent='اكتب البريد وكلمة المرور';return}
  er.textContent='';
  try{
    const r=kind==='login'?await sb.auth.signInWithPassword({email:email.trim(),password:pw}):await sb.auth.signUp({email:email.trim(),password:pw});
    if(r.error){er.textContent=r.error.message==='Invalid login credentials'?'البريد أو كلمة المرور غير صحيحة':r.error.message;return}
    if(kind==='signup'&&!r.data.session)toast('تحقق من بريدك لتأكيد الحساب ثم سجّل الدخول');
  }catch(e){er.textContent='تعذّر الاتصال. تحقق من الإنترنت'}
}

/* ============ الأحداث ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='scrim')closeSheet();return}
  if(e.target.closest('[data-stop]'))return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case 'tab':V.tab=v;render();window.scrollTo(0,0);break;
    case 'pick':V.date=el.dataset.d;V.showDone=false;render();break;
    case 'filter':V.filter=v||null;render();break;
    case 'showdone':V.showDone=!V.showDone;render();break;
    case 'toggle':e.stopPropagation();toggleDone(el.dataset.id,el.dataset.d);break;
    case 'edit':if(!e.target.closest('.chk,.pp'))taskSheet(el.dataset.id);break;
    case 'postpone':e.stopPropagation();postponeSheet(el.dataset.id);break;
    case 'pp-datepick':{const n=$('p-date-native');if(!n)break;n.value=parseDMY($('p-date').value)||today();try{n.showPicker?n.showPicker():n.click()}catch(err){n.click()}break}
    case 'pp-save':savePostpone();break;
    case 'sub-add':{syncE();addSubFromDraft();drawTaskSheet();setTimeout(()=>{const i=$('f-sub');i&&i.focus()},30);break}
    case 'sub-tog':{syncE();const x=E.subs[+el.dataset.i];if(x)x.d=!x.d;drawTaskSheet();break}
    case 'sub-del':{syncE();E.subs.splice(+el.dataset.i,1);drawTaskSheet();break}
    case 'theme':setTheme(v);render();break;
    case 'exp-csv':exportCSV();break;
    case 'exp-ics':exportICS();break;
    case 'sh-area':syncE();E.areaId=v;drawTaskSheet();break;
    case 'sh-imp':syncE();E.imp=+v;drawTaskSheet();break;
    case 'sh-time':{syncE();if(E.time)E.time=null;else{const h=(new Date().getHours()+1)%24;E.time=pad(h)+':00'}drawTaskSheet();break}
    case 'sh-rep':syncE();E.repeat={type:v,days:E.repeat.days||[]};drawTaskSheet();break;
    case 'sh-day':{syncE();const s=new Set(E.repeat.days||[]);s.has(+v)?s.delete(+v):s.add(+v);E.repeat.days=[...s].sort();drawTaskSheet();break}
    case 'sh-datepick':{syncE();const n=$('f-date-native');if(!n)break;n.value=E.date;try{n.showPicker?n.showPicker():n.click()}catch(err){n.click()}break}
    case 'sh-save':saveTask();break;
    case 'sh-cancel':closeSheet();break;
    case 'sh-del':{const id=E.id;confirmSheet('حذف هذه المهمة نهائياً؟','حذف',()=>{const t=S.tasks.find(x=>x.id===id);if(t)putTask({...t,del:true})});break}
    case 'area-new':areaSheet(null);break;
    case 'area-edit':areaSheet(el.dataset.id);break;
    case 'ar-icon':AE.name=$('a-name').value;AE.icon=v;drawAreaSheet();break;
    case 'ar-color':AE.name=$('a-name').value;AE.color=v;drawAreaSheet();break;
    case 'ar-save':saveArea();break;
    case 'ar-del':{const id=AE.id;confirmSheet('حذف هذا المجال؟ ستبقى مهامه دون مجال.','حذف',()=>{const x=S.areas.find(y=>y.id===id);if(x)putArea({...x,del:true})});break}
    case 'login':authDo('login');break;
    case 'signup':authDo('signup');break;
    case 'forgot':{const em=($('em')||{}).value;if(!em){$('auth-err').textContent='اكتب بريدك أولاً';break}
      sb.auth.resetPasswordForEmail(em.trim(),{redirectTo:location.href.split('#')[0]}).then(r=>toast(r.error?'تعذّر الإرسال':'أُرسل رابط الاستعادة إلى بريدك'));break}
    case 'chgpw':{const p=$('np').value;if(p.length<6){toast('كلمة المرور 6 أحرف على الأقل');break}
      sb.auth.updateUser({password:p}).then(r=>{toast(r.error?'تعذّر التغيير':'تم تغيير كلمة المرور');if(!r.error)$('np').value=''});break}
    case 'logout':sb.auth.signOut();break;
    case 'bn-done':toggleDone(el.dataset.id,el.dataset.d);$('banner').classList.remove('open');break;
    case 'bn-close':$('banner').classList.remove('open');break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.act==='datepick'&&t.value){V.date=t.value;V.base=V.date;render()}
  if(t.id==='p-date-native'&&t.value){const f=$('p-date');if(f)f.value=fmtDMY(t.value);const er=$('p-err');if(er)er.textContent=''}
  if(t.id==='f-date-native'&&t.value&&E){E.date=t.value;E.dateText=fmtDMY(t.value);const f=$('f-date');if(f)f.value=E.dateText;const er=$('f-date-err');if(er)er.textContent=''}
});
/* إدخال التاريخ: أرقام فقط مع إضافة الشرطات تلقائياً بصيغة DD/MM/YYYY */
document.addEventListener('input',e=>{
  if(e.target.id==='q'){V.q=e.target.value;const r=$('sr');if(r)r.innerHTML=searchResults();return}
  if(e.target.id!=='f-date'&&e.target.id!=='p-date')return;
  const d=e.target.value.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/\D/g,'').slice(0,8);
  e.target.value=d.length>4?`${d.slice(0,2)}/${d.slice(2,4)}/${d.slice(4)}`:d.length>2?`${d.slice(0,2)}/${d.slice(2)}`:d;
  const er=$('f-date-err')||$('p-err');if(er)er.textContent='';
});
$('fab').addEventListener('click',()=>taskSheet(null));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  if(e.key==='Enter'&&E&&e.target.id==='f-title'){e.preventDefault();saveTask()}
  if(e.key==='Enter'&&E&&e.target.id==='f-sub'){e.preventDefault();syncE();addSubFromDraft();drawTaskSheet();setTimeout(()=>{const i=$('f-sub');i&&i.focus()},30)}
  if(e.key==='Enter'&&PS&&e.target.id==='p-date'){e.preventDefault();savePostpone()}
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){render(true);if(sb&&session){pull().then(()=>{save();render(true);push()}).catch(()=>setSync('err'))}}
});
window.addEventListener('online',()=>{if(session)push()});
window.addEventListener('offline',()=>{if(session)setSync('err')});

/* ============ بدء التشغيل ============ */
render();
initSB();
checkReminders();
setInterval(checkReminders,20000);
setInterval(()=>{if(session)push()},60000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
