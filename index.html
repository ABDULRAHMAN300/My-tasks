/* ألوان: لون مميز واحد (بنفسجي) + ألوان حالة للأهمية فقط. خطّان: 400 و700. مسافات على شبكة 8px */
:root{
  --bg:#F6F5F8; --surface:#FFFFFF; --ink:#1C1A22; --muted:#5E5A68; --line:#E4E2EA;
  --brand:#6D28D9; --brand-t:#6D28D9; --brand-soft:#F1ECFB; --on-brand:#FFFFFF; --hdr:#5B21B6;
  --ok:#15803D; --danger:#C81E45;

  --brand:#A78BFA;--brand-t:#C4B5FD;--brand-soft:#2A2440;--on-brand:#15121C;--hdr:#1F1A2E;--ok:#4ADE80;--danger:#FB7185;
  --i1:#FB7185;--i1t:#FDA4AF;--i2:#FBBF24;--i2t:#FCD34D;--i3:#60A5FA;--i3t:#93C5FD;color-scheme:dark}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121116;--surface:#1B1A21;--ink:#F2F1F5;--muted:#A9A6B3;--line:#2E2C36;
  --brand:#A78BFA;--brand-t:#C4B5FD;--brand-soft:#2A2440;--on-brand:#15121C;--hdr:#1F1A2E;--ok:#4ADE80;--danger:#FB7185;
  --i1:#FB7185;--i1t:#FDA4AF;--i2:#FBBF24;--i2t:#FCD34D;--i3:#60A5FA;--i3t:#93C5FD;color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;font-weight:400}
body{min-height:100vh;min-height:100dvh;padding-bottom:calc(152px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.ic{width:20px;height:20px;flex:none;display:block}
.ic.s{width:16px;height:16px}
.ic.xs{width:14px;height:14px}
.ic.l{width:24px;height:24px}

/* الترويسة: لون واحد مسطح، بلا تدرج أو توهج */
.hero{color:#fff;background:var(--hdr);padding:calc(16px + env(safe-area-inset-top)) 0 24px;border-radius:0 0 24px 24px}
.hero .wrap{display:flex;align-items:center;gap:16px}
.hero-txt{flex:1;min-width:0}
.hero small{display:block;font-size:.85rem;opacity:.85}
.hero h1{margin:0;font-size:1.75rem;font-weight:700;line-height:1.3}
.hero .sub{font-size:.95rem;opacity:.92}
.ring{width:80px;height:80px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:rgba(255,255,255,.22)} .ring .fg{stroke:#fff;transition:stroke-dashoffset .5s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}
.chip-sync{display:inline-flex;align-items:center;gap:8px;margin-top:8px;font-size:.8rem;opacity:.9}
.chip-sync i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55)}
.chip-sync.ok i{background:#4ADE80} .chip-sync.sync i{background:#FACC15} .chip-sync.err i{background:#FDA4AF}

/* شريط مصغّر يظهر عند التمرير */
.minibar{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--hdr);color:#fff;padding-top:env(safe-area-inset-top);transform:translateY(-100%);transition:transform .2s ease;pointer-events:none}
.minibar.on{transform:none;pointer-events:auto}
.minibar .wrap{display:flex;align-items:center;gap:12px;min-height:48px;font-size:.88rem}
.minibar span{opacity:.85}
.minibar .mb-p{margin-inline-start:auto;font-weight:700;opacity:1;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.minibar{transition:none}}
/* السحب على المهمة */
.swrap{position:relative;margin-bottom:8px;border-radius:var(--radius);overflow:hidden}
.swrap .task{margin-bottom:0;touch-action:pan-y}
.swrap.drag .task{transition:none}
.swrap .task{transition:transform .2s ease}
.sbg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-weight:700;font-size:.9rem;opacity:0}
.swrap.drag .sbg,.swrap.go .sbg{opacity:1}
.sbg span{display:inline-flex;align-items:center;gap:8px;opacity:0}
.swrap.l .sbg{background:var(--ok);color:#fff}.swrap.l .sb-done{opacity:1}
.swrap.r .sbg{background:var(--brand);color:var(--on-brand)}.swrap.r .sb-pp{opacity:1}
:root[data-theme="dark"] .swrap.l .sbg{color:#0B1F12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .swrap.l .sbg{color:#0B1F12}}
/* شريط الأيام */
.strip{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 8px;margin:0 -16px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.day{flex:none;width:52px;padding:8px 0;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:center;scroll-snap-align:center;position:relative}
.day span{display:block;font-size:.75rem;color:var(--muted)}
.day b{display:block;font-size:1.15rem;line-height:1.4;font-weight:700;font-variant-numeric:tabular-nums}
.day.today b{color:var(--brand-t)}
.day.sel{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.day.sel span,.day.sel b{color:var(--on-brand)}
.day i{position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--muted)}
.day.sel i{background:var(--on-brand)}
.day-more{flex:none;width:52px;border-radius:14px;border:1px dashed var(--line);display:grid;place-items:center;position:relative;background:var(--surface);color:var(--muted)}
.day-more input{position:absolute;inset:0;opacity:0;width:100%;height:100%}

/* فلاتر المجالات */
.filters{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:8px;padding:4px 16px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:.88rem;min-height:40px}
.fchip .ic{color:var(--ac,var(--muted))}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.fchip.on .ic{color:inherit}

/* الأقسام والمهام */
.sec{margin-top:24px}
.sec-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;margin:0 0 8px;color:var(--impt)}
.sec-h .dot{width:8px;height:8px;border-radius:50%;background:var(--imp)}
.sec-h em{font-style:normal;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.task{display:flex;align-items:center;gap:8px;border-radius:var(--radius);padding:12px 16px 12px 8px;margin-bottom:8px;position:relative;overflow:hidden;cursor:pointer;
  background:var(--surface);border:1px solid var(--line)}
.task::before{content:"";position:absolute;top:12px;bottom:12px;right:0;width:3px;border-radius:3px 0 0 3px;background:var(--imp)}
.task .ti{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--ac) 12%,var(--surface));color:color-mix(in srgb,var(--ac) 80%,var(--ink))}
.task .tb{flex:1;min-width:0;padding-inline-start:4px}
.task .tt{font-weight:700;font-size:1rem;line-height:1.5;overflow-wrap:anywhere}
.task .tm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:4px;font-size:.8rem;color:var(--muted)}
.m{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.m.imp{color:var(--impt);font-weight:700}
.m.time{color:var(--brand-t);font-weight:700;font-variant-numeric:tabular-nums}
.m.time.due,.m.late{color:var(--danger);font-weight:700}
.chk{flex:none;width:44px;height:44px;display:grid;place-items:center}
.chk span{width:26px;height:26px;border-radius:50%;border:2px solid var(--imp);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.chk span .ic{width:16px;height:16px;stroke-width:3}
.task.done{opacity:.6}
.task.done .tt{text-decoration:line-through;font-weight:400}
.task.done .chk span{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.toggle-done{width:100%;padding:8px;min-height:44px;border-radius:12px;background:transparent;border:1px dashed var(--line);color:var(--muted);margin-top:8px}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty .ic{width:40px;height:40px;margin:0 auto 8px;stroke-width:1.5}
.date-h{margin:24px 0 8px;font-weight:700;color:var(--ink);font-size:1rem}

/* التنقل والزر العائم */
.nav{position:fixed;inset:auto 0 0 0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:20}
.nav .in{display:flex;width:100%;max-width:560px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 4px;color:var(--muted);font-size:.72rem;min-height:56px}
.nav button.on{color:var(--brand-t);font-weight:700}
.fab{position:fixed;left:16px;bottom:calc(80px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:16px;
  background:var(--brand);color:var(--on-brand);z-index:21;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.fab .ic{width:26px;height:26px}

/* النافذة السفلية */
.scrim{position:fixed;inset:0;background:rgba(10,8,16,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;border-radius:24px 24px 0 0;
  padding:24px 16px calc(16px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.ring .fg{transition:none}}
.sheet h2{margin:0 0 8px;font-size:1.2rem;font-weight:700}
.lbl{display:block;font-size:.85rem;color:var(--muted);margin:16px 0 8px}
.inp{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);min-height:48px}
textarea.inp{min-height:80px;resize:vertical}
.err{color:var(--danger);font-size:.82rem;margin-top:4px;min-height:1em}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg.c3{grid-template-columns:repeat(3,1fr)}
.opt{padding:8px 4px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:.88rem;min-height:48px;
  display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.opt.on{border-color:var(--c,var(--brand));background:color-mix(in srgb,var(--c,var(--brand)) 12%,var(--surface));font-weight:700;box-shadow:inset 0 0 0 1px var(--c,var(--brand))}
.opt .d{width:8px;height:8px;border-radius:50%;background:var(--c)}
.areas{display:flex;flex-wrap:wrap;gap:8px}
.area-opt{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--bg);min-height:44px}
.area-opt .ic{color:color-mix(in srgb,var(--c) 80%,var(--ink))}
.area-opt.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));font-weight:700;box-shadow:inset 0 0 0 1px var(--c)}
.row{display:flex;gap:8px;align-items:center}
.switch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);min-height:52px}
.sw{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .15s}
.sw.on{background:var(--brand)} .sw.on::after{right:23px}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
.btns{display:flex;gap:8px;margin-top:24px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;font-weight:700;min-height:48px;background:var(--bg);border:1px solid var(--line)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.sheet .btns{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--surface);padding:16px 0 calc(8px + env(safe-area-inset-bottom));margin-top:16px;z-index:2}
.btn.del{flex:none;padding:12px 16px;color:var(--danger);border-color:var(--danger);background:transparent}
.btn.cal{flex:none;width:48px;padding:0;color:var(--muted)}
.timebox{display:flex;align-items:center;gap:8px;direction:ltr}
.timebox select{width:auto;min-width:72px;min-height:44px;padding:4px 8px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.timebox b{font-weight:700}
.dateinp{direction:ltr;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
.icons,.colors{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.icons button{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--ink)}
.icons button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-t);box-shadow:inset 0 0 0 1px var(--brand)}
.colors button{aspect-ratio:1;border-radius:50%;border:2px solid transparent}
.colors button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}

/* المهمة التالية */
.next{margin-top:16px;border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;cursor:pointer;background:var(--surface);border:1px solid var(--line)}
.next::before{content:"";position:absolute;top:16px;bottom:16px;right:0;width:3px;border-radius:3px 0 0 3px;background:var(--imp)}
.next small{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.8rem}
.next .nt{font-weight:700;font-size:1.1rem;line-height:1.5;margin:4px 0 8px;overflow-wrap:anywhere}
.next .nb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.next .nb button{margin-inline-start:auto;display:inline-flex;align-items:center;gap:4px;background:var(--brand-soft);color:var(--brand-t);border-radius:12px;padding:4px 16px;font-weight:700;min-height:40px}
/* التأجيل والخطوات */
.pp{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.subs{display:flex;flex-direction:column;gap:8px}
.stp{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);min-height:48px}
.stp .sc{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:transparent}
.stp .sc .ic{width:14px;height:14px;stroke-width:3}
.stp.on .sc{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.stp.on .st{text-decoration:line-through;color:var(--muted)}
.stp .st{flex:1;overflow-wrap:anywhere}
.stp .sx{flex:none;width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}
.subadd{display:flex;gap:8px;margin-top:8px}
.subadd .inp{min-height:48px}
.subadd .btn{flex:none;width:48px;padding:0}
/* البحث والإحصائيات */
.searchbox{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.kpi{border-radius:var(--radius);padding:12px 8px;text-align:center;background:var(--surface);border:1px solid var(--line)}
.kpi b{display:block;font-size:1.5rem;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px;direction:ltr}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar small{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--line);position:relative;overflow:hidden;min-height:4px}
.bar i u{position:absolute;inset:auto 0 0 0;background:var(--brand);display:block}
.bar span{font-size:.72rem;color:var(--muted)}
.bar.today span{color:var(--brand-t);font-weight:700}
.prow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.9rem}
.prow .pl{width:80px;flex:none}
.prow .pt{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prow .pt u{display:block;height:100%;border-radius:99px;background:var(--c)}
.prow .pn{width:44px;flex:none;text-align:left;color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr}
.themeseg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* الإعدادات */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:16px}
.card h3{margin:0 0 8px;font-size:1rem;font-weight:700}
.card p{margin:8px 0}
.arow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.arow:last-of-type{border-bottom:0}
.arow .ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 12%,var(--surface));color:color-mix(in srgb,var(--ac) 80%,var(--ink))}
.arow span{flex:1}
.link{color:var(--brand-t);font-weight:700;padding:8px;min-height:44px}

/* التنبيه والإشعار المؤقت */
.banner{position:fixed;top:calc(8px + env(safe-area-inset-top));left:12px;right:12px;max-width:536px;margin:0 auto;z-index:60;display:none;
  background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.banner.open{display:block}
.banner .bt{font-weight:700;display:flex;align-items:center;gap:8px} .banner .bs{opacity:.85;font-size:.88rem}
.banner .bb{display:flex;gap:8px;margin-top:8px}
.banner button{padding:4px 16px;border-radius:12px;background:rgba(255,255,255,.14);color:inherit;font-size:.88rem;min-height:40px;font-weight:700}
.banner button.go{background:var(--brand);color:var(--on-brand)}
.toast{position:fixed;bottom:calc(152px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:8px 16px;border-radius:12px;font-size:.88rem;z-index:70;display:none;max-width:90%}
.toast.open{display:block}
@media (hover:hover) and (pointer:fine){.task:hover,.next:hover{border-color:color-mix(in srgb,var(--ink) 22%,var(--line))}}
button:active{transform:scale(.97)}
</style>
</head>

const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

/* التاريخ: DD/MM/YYYY — الوقت: 24 ساعة HH:MM */
const fmtDMY=s=>{if(!s)return'';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`};
const parseDMY=t=>{
  const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec((t||'').trim());if(!m)return null;
  const d=+m[1],mo=+m[2],y=+m[3];if(y<2000||y>2100)return null;
  const dt=new Date(y,mo-1,d);
  return (dt.getFullYear()===y&&dt.getMonth()===mo-1&&dt.getDate()===d)?`${y}-${pad(mo)}-${pad(d)}`:null;
};
const fmtTime=t=>t||'';

function load(){
  try{
    const s=JSON.parse(localStorage.getItem(LS)||'null');
    if(s&&Array.isArray(s.tasks)&&Array.isArray(s.areas)){s.dirty=s.dirty||{a:{},t:{}};return s}
  }catch(e){}
  return {owner:null,areas:DEFAULT_AREAS.map(a=>({...a,del:false,ts:0})),tasks:[],dirty:{a:{},t:{}},lastArea:'a-job'};
}
let S=load();
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const V={tab:'today',date:today(),base:today(),filter:null,showDone:false,q:''};
const areaOf=id=>S.areas.find(a=>a.id===id&&!a.del)||{id:null,name:'غير مصنّف',icon:'pin',color:'#64748B'};
const liveAreas=()=>S.areas.filter(a=>!a.del).sort((a,b)=>a.sort-b.sort);

/* ============ منطق التكرار والترتيب ============ */
const isRep=t=>t.repeat&&t.repeat.type&&t.repeat.type!=='none';
function occursOn(t,d){
  if(t.del)return false;
  if(!isRep(t))return t.date===d;
  if(d<t.date)return false;
  const r=t.repeat,dt=parse(d);
  if(r.type==='daily')return true;
  if(r.type==='weekly')return (r.days&&r.days.length?r.days:[parse(t.date).getDay()]).includes(dt.getDay());
  if(r.type==='monthly')return dt.getDate()===parse(t.date).getDate();
  return false;
}
const isDone=(t,d)=>isRep(t)?(t.doneDates||[]).includes(d):!!t.done;
function itemsFor(d){
  const out=[];
  const td=today();
  for(const t of S.tasks){
    if(t.del)continue;
    if(occursOn(t,d))out.push({t,d,late:0});
    else if(d===td&&!isRep(t)&&!t.done&&t.date<td)out.push({t,d:t.date,late:diffDays(td,t.date)});
  }
  return out;
}
function sortItems(a,b){
  const ia=impOf(a.t),ib=impOf(b.t);
  if(ia!==ib)return ia-ib;
  if(!!a.late!==!!b.late)return a.late?-1:1;
  const ta=a.t.time||'',tb=b.t.time||'';
  if(!!ta!==!!tb)return ta?-1:1;
  if(ta!==tb)return ta<tb?-1:1;
  return (a.t.cts||0)-(b.t.cts||0);
}

/* ============ العرض ============ */
function repLabel(t){
  const r=t.repeat||{};
  if(r.type==='daily')return 'يوميًا';
  if(r.type==='weekly'){const ds=(r.days&&r.days.length?r.days:[parse(t.date).getDay()]).slice().sort();return ds.length===7?'يوميًا':'كل '+ds.map(i=>DAYS_S[i]).join('، ')}
  if(r.type==='monthly')return 'شهريًا يوم '+parse(t.date).getDate();
  return '';
}
function taskCard(it){
  const {t,d,late}=it,a=areaOf(t.areaId),imp=IMP.find(i=>i.v===impOf(t))||IMP[2];
  const done=isDone(t,d);
  const due=t.time&&!late&&d===today()&&!done&&t.time<=nowHM();
  const tags=[];
  if(!it.grouped)tags.push(`<span class="m imp">${imp.name}</span>`);
  if(late)tags.push(`<span class="m late">متأخرة ${late===1?'منذ يوم':late===2?'منذ يومين':'منذ '+late+' أيام'}</span>`);
  if(t.time&&!late)tags.push(`<span class="m time${due?' due':''}">${ic('clock','xs')}<bdi>${fmtTime(t.time)}</bdi></span>`);
  if(it.sd)tags.push(`<span class="m">${ic('calendar','xs')}<bdi>${fmtDMY(t.date)}</bdi></span>`);
  tags.push(`<span class="m">${esc(a.name)}</span>`);
  const subs=t.subs||[];if(subs.length)tags.push(`<span class="m" aria-label="الخطوات">${ic('list-checks','xs')}<bdi>${subs.filter(x=>x.d).length}/${subs.length}</bdi></span>`);
  if(t.note)tags.push(`<span class="m" aria-label="فيها ملاحظة">${ic('sticky-note','xs')}</span>`);
  if(isRep(t))tags.push(`<span class="m">${ic('repeat','xs')}${repLabel(t)}</span>`);
  const canPP=!isRep(t)&&!done;
  return `<div class="swrap" data-id="${esc(t.id)}" data-d="${d}"${canPP?' data-pp="1"':''}><div class="sbg" aria-hidden="true"><span class="sb-done">${ic('check','s')}${done?'إلغاء الإنجاز':'تم'}</span><span class="sb-pp">${canPP?ic('calendar-clock','s')+'تأجيل':''}</span></div><div class="task${done?' done':''}" data-act="edit" data-id="${esc(t.id)}" style="--ac:${safeColor(a.color)};${impStyle(imp)}">
    <div class="ti">${areaIc(a)}</div>
    <div class="tb"><div class="tt">${esc(t.title)}</div><div class="tm">${tags.join('')}</div></div>
    ${(!isRep(t)&&!done)?`<button class="pp" data-act="postpone" data-id="${esc(t.id)}" aria-label="تأجيل إلى تاريخ">${ic('calendar-clock')}</button>`:''}
    <button class="chk" data-act="toggle" data-id="${esc(t.id)}" data-d="${d}" aria-label="${done?'إلغاء الإنجاز':'تم الإنجاز'}"><span>${ic('check')}</span></button>
  </div></div>`;
}
function groupHTML(items,showDone){
  if(!items.length)return '';
  const open=items.filter(i=>!isDone(i.t,i.d)).sort(sortItems);
  const done=items.filter(i=>isDone(i.t,i.d)).sort(sortItems);
  let h='';
  for(const imp of IMP){
    const g=open.filter(i=>impOf(i.t)===imp.v);
    if(!g.length)continue;
    h+=`<section class="sec" style="${impStyle(imp)}"><div class="sec-h"><span class="dot"></span>${imp.name}<em>${g.length}</em></div>${g.map(i=>taskCard({...i,grouped:1})).join('')}</section>`;
  }
  if(done.length){
    h+=`<section class="sec"><button class="toggle-done" data-act="showdone">${showDone?'إخفاء':'عرض'} المنجزة (${done.length})</button>${showDone?'<div style="margin-top:8px">'+done.map(taskCard).join('')+'</div>':''}</section>`;
  }
  return h;
}
function nextCard(items){
  const open=items.filter(i=>!isDone(i.t,i.d));
  if(open.length<2)return '';
  const hm=nowHM();
  const timed=open.filter(i=>!i.late&&i.t.time&&i.t.time>=hm).sort((a,b)=>a.t.time<b.t.time?-1:a.t.time>b.t.time?1:impOf(a.t)-impOf(b.t));
  const it=timed[0]||open.sort(sortItems)[0];
  const imp=IMP.find(i=>i.v===impOf(it.t))||IMP[2],a=areaOf(it.t.areaId);
  const label=timed[0]?`${ic('clock','s')}المهمة التالية · الساعة <bdi>${it.t.time}</bdi>`:`${ic('target','s')}الأولى بالإنجاز الآن`;
  return `<div class="next" data-act="edit" data-id="${esc(it.t.id)}" style="${impStyle(imp)}"><small>${label}</small>
    <div class="nt">${esc(it.t.title)}</div>
    <div class="nb"><span class="m imp">${imp.name}</span><span>${esc(a.name)}</span><button data-act="toggle" data-id="${esc(it.t.id)}" data-d="${it.d}">${ic('check','s')}تم</button></div></div>`;
}
function viewToday(){
  const td=today();
  let items=itemsFor(V.date);
  const total=items.length;
  const nxt=(V.date===td&&!V.filter)?nextCard(items.slice()):'';
  if(V.filter)items=items.filter(i=>i.t.areaId===V.filter);
  let strip='';

    const d=addDays(V.base,i),dt=parse(d);

  const filters=areas.length?`<div class="filters"><button class="fchip${!V.filter?' on':''}" data-act="filter" data-v="">الكل</button>${areas.map(a=>`<button class="fchip${V.filter===a.id?' on':''}" style="--ac:${safeColor(a.color)}" data-act="filter" data-v="${esc(a.id)}">${areaIc(a,'s')}${esc(a.name)}</button>`).join('')}</div>`:'';

function viewUpcoming(){
  const td=today();let h='';const seen=new Set();
  for(let i=1;i<=14;i++){
    const d=addDays(td,i);
    const items=itemsFor(d).filter(it=>!isDone(it.t,it.d)&&!(isRep(it.t)&&seen.has(it.t.id)));
    items.forEach(it=>{if(isRep(it.t))seen.add(it.t.id)});
    if(!items.length)continue;
    h+=`<div class="date-h">${i===1?'غداً · ':''}${longDate(d)}</div>`+items.sort(sortItems).map(taskCard).join('');

const normQ=x=>String(x||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
function searchResults(){
  const q=normQ(V.q).trim();
  if(!q)return `<div class="empty">${ic('search')}اكتب كلمة للبحث في كل مهامك (العنوان، الملاحظة، الخطوات، المجال)</div>`;
  const hits=S.tasks.filter(t=>!t.del&&normQ([t.title,t.note,areaOf(t.areaId).name,...(t.subs||[]).map(x=>x.t)].join(' ')).includes(q));
  if(!hits.length)return `<div class="empty">${ic('search-x')}لا نتائج مطابقة</div>`;
  const items=hits.map(t=>({t,d:t.date,late:0,sd:1}));
  const open=items.filter(i=>!isDone(i.t,i.d)).sort((a,b)=>a.t.date<b.t.date?-1:a.t.date>b.t.date?1:sortItems(a,b));
  const done=items.filter(i=>isDone(i.t,i.d)).sort((a,b)=>a.t.date<b.t.date?1:-1);
  return `<div class="date-h">${hits.length} نتيجة</div>`+open.concat(done).slice(0,80).map(taskCard).join('');

function viewSearch(){
  return `<div class="searchbox"><input class="inp" id="q" type="search" placeholder="ابحث في مهامك…" value="${esc(V.q)}" autocomplete="off" enterkeyhint="search"></div><div id="sr">${searchResults()}</div>`;

function viewStats(){
  const td=today(),days=[];
  for(let i=6;i>=0;i--){
    const d=addDays(td,-i),its=S.tasks.filter(t=>occursOn(t,d));
    days.push({d,total:its.length,done:its.filter(t=>isDone(t,d)).length});
  }
  const tot=days.reduce((n,x)=>n+x.total,0),dn=days.reduce((n,x)=>n+x.done,0),pct=tot?Math.round(dn/tot*100):0;

  const inRange=(t,fn)=>{let a=0,b=0;days.forEach(x=>{if(occursOn(t,x.d)&&fn(t)){a++;if(isDone(t,x.d))b++}});return [a,b]};

function putTask(t){
  t.ts=Date.now();
  const i=S.tasks.findIndex(x=>x.id===t.id);
  if(i>=0)S.tasks[i]=t;else S.tasks.push(t);
  S.dirty.t[t.id]=1;save();render();push();
}
function putArea(a){
  a.ts=Date.now();
  const i=S.areas.findIndex(x=>x.id===a.id);
  if(i>=0)S.areas[i]=a;else S.areas.push(a);
  S.dirty.a[a.id]=1;save();render();push();
}
function toggleDone(id,d){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const c={...t};
  if(isRep(c)){
    const set=new Set(c.doneDates||[]);
    set.has(d)?set.delete(d):set.add(d);
    c.doneDates=[...set].sort().slice(-400);
  }else c.done=!c.done;
  putTask(c);
}

/* ============ تصدير ============ */
function dlFile(name,mime,text){
  const blob=new Blob([text],{type:mime});
  const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
  if(isIOS&&navigator.canShare&&window.File){
    const f=new File([blob],name,{type:mime});
    if(navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
const liveTasks=()=>S.tasks.filter(t=>!t.del).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:sortItems({t:a,late:0},{t:b,late:0}));
function exportCSV(){
  const q=v=>{let x=String(v==null?'':v);if(/^[=+\-@]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};
  const rows=[['العنوان','المجال','الأهمية','التاريخ','الوقت','التكرار','الحالة','الخطوات','ملاحظة']];
  for(const t of liveTasks()){
    const imp=IMP.find(i=>i.v===impOf(t)).name;
    const rp=isRep(t)?({daily:'يومي',weekly:'أسبوعي',monthly:'شهري'}[t.repeat.type]):'';
    const st=isRep(t)?`متكررة (أُنجزت ${(t.doneDates||[]).length} مرة)`:(t.done?'منجزة':'غير منجزة');
    rows.push([t.title,areaOf(t.areaId).name,imp,fmtDMY(t.date),t.time||'',rp,st,(t.subs||[]).map(x=>(x.d?'[x] ':'[ ] ')+x.t).join(' | '),t.note||'']);
  }
  dlFile('mahami-tasks.csv','text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'));
  toast('تم تجهيز ملف CSV');
}
function icsFold(line){
  const enc=new TextEncoder(),out=[];let cur='',len=0;
  for(const ch of line){const b=enc.encode(ch).length;if(len+b>72){out.push(cur);cur=' '+ch;len=1+b}else{cur+=ch;len+=b}}
  out.push(cur);return out.join('\r\n');
}
function exportICS(){
  const e=x=>String(x||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mahami//AR','CALSCALE:GREGORIAN','X-WR-CALNAME:مهامي'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  let n=0;
  for(const t of liveTasks()){
    if(!isRep(t)&&t.done)continue;
    const a=areaOf(t.areaId),ymd8=t.date.replace(/-/g,'');
    L.push('BEGIN:VEVENT','UID:'+t.id+'@mahami',`DTSTAMP:${stamp}`);
    if(t.time)L.push(`DTSTART:${ymd8}T${t.time.replace(':','')}00`);else L.push(`DTSTART;VALUE=DATE:${ymd8}`);
    L.push('SUMMARY:'+e(t.title));
    const desc=[IMP.find(i=>i.v===impOf(t)).name+' · '+a.name,...(t.subs||[]).map(x=>(x.d?'☑ ':'☐ ')+x.t),t.note].filter(Boolean).join('\n');
    L.push('DESCRIPTION:'+e(desc));
    L.push('PRIORITY:'+({1:1,2:5,3:9}[impOf(t)]));
    if(t.repeat&&t.repeat.type==='daily')L.push('RRULE:FREQ=DAILY');
    else if(t.repeat&&t.repeat.type==='weekly'){const c=['SU','MO','TU','WE','TH','FR','SA'],ds=(t.repeat.days&&t.repeat.days.length?t.repeat.days:[parse(t.date).getDay()]);L.push('RRULE:FREQ=WEEKLY;BYDAY='+ds.map(i=>c[i]).join(','))}
    else if(t.repeat&&t.repeat.type==='monthly')L.push('RRULE:FREQ=MONTHLY');
    if(t.time)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e(t.title),'TRIGGER:PT0M','END:VALARM');
    L.push('END:VEVENT');n++;
  }
  L.push('END:VCALENDAR');
  dlFile('mahami-tasks.ics','text/calendar;charset=utf-8',L.map(icsFold).join('\r\n')+'\r\n');
  toast(n?`تم تجهيز ${n} مهمة في ملف ICS`:'لا مهام غير منجزة للتصدير');
}

function getTheme(){try{return localStorage.getItem('mahami.theme')||'auto'}catch(e){return 'auto'}}
function setTheme(m){
  try{m==='auto'?localStorage.removeItem('mahami.theme'):localStorage.setItem('mahami.theme',m)}catch(e){}
  const r=document.documentElement;m==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',m);
}

/* ============ نافذة المجال ============ */
let AE=null;
function areaSheet(id){
  const a=id&&S.areas.find(x=>x.id===id);
  AE=a?{...a}:{id:null,name:'',icon:ICONS[0],color:COLORS[0],sort:S.areas.length,del:false};
  drawAreaSheet();
}
function drawAreaSheet(){
  openSheet(`
    <h2>${AE.id?'تعديل المجال':'مجال جديد'}</h2>
    <label class="lbl" for="a-name">اسم المجال</label>
    <input class="inp" id="a-name" maxlength="30" value="${esc(AE.name)}" autocomplete="off">
    <div class="err" id="a-err"></div>
    <span class="lbl">الأيقونة</span>
    <div class="icons">${ICONS.map(i=>`<button class="${icName(AE.icon)===i?'on':''}" data-act="ar-icon" data-v="${i}" aria-label="${i}">${ic(i)}</button>`).join('')}</div>
    <span class="lbl">اللون</span>
    <div class="colors">${COLORS.map(c=>`<button class="${AE.color===c?'on':''}" style="background:${c}" data-act="ar-color" data-v="${c}" aria-label="${c}"></button>`).join('')}</div>
    <div class="btns">
      ${AE.id?'<button class="btn del" data-act="ar-del">حذف</button>':''}
      <button class="btn" data-act="sh-cancel">إلغاء</button>
      <button class="btn pri" data-act="ar-save">حفظ</button>
    </div>`);
}
function saveArea(){
  const n=$('a-name').value.trim();AE.name=n;
  if(!n){$('a-err').textContent='اكتب اسم المجال';return}
  putArea({...AE,id:AE.id||uid()});closeSheet();
}
function confirmSheet(msg,ok,fn){
  openSheet(`<h2>${esc(msg)}</h2><div class="btns"><button class="btn" data-act="sh-cancel">إلغاء</button><button class="btn pri" id="cf-ok" style="background:var(--danger);border-color:var(--danger)">${esc(ok)}</button></div>`);
  $('cf-ok').onclick=()=>{closeSheet();fn()};
}

/* ============ التنبيه داخل التطبيق ============ */
const notified=new Set();
function dueItems(){
  const td=today(),hm=nowHM();
  return itemsFor(td).filter(i=>!i.late&&i.t.time&&i.t.time<=hm&&!isDone(i.t,i.d));
}
function updateBadge(){
  const n=dueItems().length;
  document.title=(n?`(${n}) `:'')+'مهامي';
  if('setAppBadge' in navigator){try{n?navigator.setAppBadge(n):navigator.clearAppBadge()}catch(e){}}
}
function checkReminders(){
  const hm=nowHM(),td=today();
  const [h,m]=hm.split(':').map(Number),nowMin=h*60+m;
  for(const it of itemsFor(td)){
    if(it.late||!it.t.time||isDone(it.t,it.d))continue;
    const [th,tm]=it.t.time.split(':').map(Number),diff=nowMin-(th*60+tm);
    const key=it.t.id+'|'+td;
    if(diff>=0&&diff<=15&&!notified.has(key)){
      notified.add(key);
      const b=$('banner');
      b.innerHTML=`<div class="bt">${ic('alarm-clock','s')}حان وقت بداية مهمة</div><div class="bs">${esc(it.t.title)} · <bdi>${fmtTime(it.t.time)}</bdi></div>
        <div class="bb"><button class="go" data-act="bn-done" data-id="${esc(it.t.id)}" data-d="${it.d}">تم</button><button data-act="bn-close">إغلاق</button></div>`;
      b.classList.add('open');
      if(navigator.vibrate)try{navigator.vibrate(120)}catch(e){}
      break;
    }
  }
  render(true);
}

/* ============ المزامنة (Supabase) ============ */
let sb=null,session=null,syncState='local',pushing=false,channel=null;
const taskToRow=t=>({id:t.id,date:t.date,title:t.title,note:t.note||'',area_id:t.areaId||null,importance:impOf(t),
  start_time:t.time||null,done:!!t.done,repeat:{...(t.repeat||{type:'none'}),subs:t.subs||[]},done_dates:t.doneDates||[],deleted:!!t.del,cts:t.cts||0,ts:t.ts||0});
const rowToTask=r=>({id:r.id,date:r.date,title:r.title,note:r.note||'',areaId:r.area_id,imp:r.importance,time:r.start_time,
  done:!!r.done,repeat:(({subs,...x})=>x)(r.repeat||{type:'none'}),subs:Array.isArray((r.repeat||{}).subs)?r.repeat.subs:[],doneDates:r.done_dates||[],del:!!r.deleted,cts:Number(r.cts)||0,ts:Number(r.ts)||0});
const areaToRow=a=>({id:a.id,name:a.name,icon:a.icon,color:a.color,sort:a.sort||0,deleted:!!a.del,ts:a.ts||0});
const rowToArea=r=>({id:r.id,name:r.name,icon:r.icon,color:r.color,sort:r.sort||0,del:!!r.deleted,ts:Number(r.ts)||0});
function setSync(s){syncState=s;renderSync()}

function mergeRemote(kind,remote){ // kind: 'a' | 't'
  const list=kind==='a'?S.areas:S.tasks,conv=kind==='a'?rowToArea:rowToTask;
  const r=conv(remote),i=list.findIndex(x=>x.id===r.id);
  if(i<0){list.push(r);return true}
  if(r.ts>list[i].ts){list[i]=r;delete S.dirty[kind][r.id];return true}
  if(r.ts<list[i].ts)S.dirty[kind][r.id]=1;
  return false;
}
async function pull(){
  const [a,t]=await Promise.all([sb.from('mahami_areas').select('*'),sb.from('mahami_tasks').select('*')]);
  if(a.error)throw a.error;if(t.error)throw t.error;
  const ra=new Set(a.data.map(r=>r.id)),rt=new Set(t.data.map(r=>r.id));
  a.data.forEach(r=>mergeRemote('a',r));t.data.forEach(r=>mergeRemote('t',r));
  S.areas.forEach(x=>{if(!ra.has(x.id))S.dirty.a[x.id]=1});
  S.tasks.forEach(x=>{if(!rt.has(x.id))S.dirty.t[x.id]=1});
  save();
}
async function push(){
  if(!sb||!session||pushing)return;
  const da=S.areas.filter(x=>S.dirty.a[x.id]),dt=S.tasks.filter(x=>S.dirty.t[x.id]);
  if(!da.length&&!dt.length)return;
  pushing=true;setSync('sync');
  try{
    if(da.length){const {error}=await sb.from('mahami_areas').upsert(da.map(areaToRow),{onConflict:'id'});if(error)throw error;
      da.forEach(x=>{const c=S.areas.find(y=>y.id===x.id);if(c&&c.ts===x.ts)delete S.dirty.a[x.id]})}
    for(let i=0;i<dt.length;i+=200){
      const part=dt.slice(i,i+200);
      const {error}=await sb.from('mahami_tasks').upsert(part.map(taskToRow),{onConflict:'id'});if(error)throw error;
      part.forEach(x=>{const c=S.tasks.find(y=>y.id===x.id);if(c&&c.ts===x.ts)delete S.dirty.t[x.id]});
    }
    save();setSync('ok');
  }catch(e){console.warn('push',e);setSync('err')}
  finally{pushing=false}
  if(S.areas.some(x=>S.dirty.a[x.id])||S.tasks.some(x=>S.dirty.t[x.id])){if(syncState==='ok')setTimeout(push,300)}
}
async function startSync(){
  if(!sb||!session)return;
  if(S.owner&&S.owner!==session.user.id){ // حساب مختلف على نفس الجهاز: لا نخلط البيانات
    S={owner:null,areas:DEFAULT_AREAS.map(a=>({...a,del:false,ts:0})),tasks:[],dirty:{a:{},t:{}},lastArea:'a-job'};
  }
  S.owner=session.user.id;save();
  setSync('sync');
  try{await pull();render();await push();if(syncState!=='err')setSync('ok');subscribe()}
  catch(e){console.warn('sync',e);setSync('err')}
}
function subscribe(){
  if(channel){try{sb.removeChannel(channel)}catch(e){}channel=null}
  channel=sb.channel('mahami-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'mahami_tasks'},p=>{if(p.new&&p.new.id&&mergeRemote('t',p.new)){save();render(true)}})
    .on('postgres_changes',{event:'*',schema:'public',table:'mahami_areas'},p=>{if(p.new&&p.new.id&&mergeRemote('a',p.new)){save();render(true)}})
    .subscribe();
}
function initSB(){
  if(!window.supabase){setSync('local');return}
  try{
    sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  }catch(e){console.warn(e);sb=null;return}
  sb.auth.onAuthStateChange((ev,s)=>{
    session=s;
    if(ev==='PASSWORD_RECOVERY'){V.tab='settings';toast('اكتب كلمة المرور الجديدة ثم احفظها')}
    if(s)setTimeout(startSync,0);
    else{if(channel){try{sb.removeChannel(channel)}catch(e){}channel=null}setSync('local')}
    render();
  });
}
async function authDo(kind){
  const email=($('em')||{}).value,pw=($('pw')||{}).value,er=$('auth-err');
  if(!email||!pw){er.textContent='اكتب البريد وكلمة المرور';return}
  er.textContent='';
  try{
    const r=kind==='login'?await sb.auth.signInWithPassword({email:email.trim(),password:pw}):await sb.auth.signUp({email:email.trim(),password:pw});
    if(r.error){er.textContent=r.error.message==='Invalid login credentials'?'البريد أو كلمة المرور غير صحيحة':r.error.message;return}
    if(kind==='signup'&&!r.data.session)toast('تحقق من بريدك لتأكيد الحساب ثم سجّل الدخول');
  }catch(e){er.textContent='تعذّر الاتصال. تحقق من الإنترنت'}
}

/* ============ الأحداث ============ */
document.addEventListener('click',e=>{
  if(Date.now()-swipedAt<350){e.preventDefault();return}
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='scrim')closeSheet();return}
  if(e.target.closest('[data-stop]'))return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case 'tab':V.tab=v;render();window.scrollTo(0,0);updateMinibar();break;
    case 'pick':V.date=el.dataset.d;V.showDone=false;render();break;
    case 'filter':V.filter=v||null;render();break;
    case 'showdone':V.showDone=!V.showDone;render();break;
    case 'toggle':e.stopPropagation();toggleDone(el.dataset.id,el.dataset.d);break;
    case 'edit':if(!e.target.closest('.chk,.pp'))taskSheet(el.dataset.id);break;
    case 'postpone':e.stopPropagation();postponeSheet(el.dataset.id);break;
    case 'pp-datepick':{const n=$('p-date-native');if(!n)break;n.value=parseDMY($('p-date').value)||today();try{n.showPicker?n.showPicker():n.click()}catch(err){n.click()}break}
    case 'pp-save':savePostpone();break;
    case 'sub-add':{syncE();addSubFromDraft();drawTaskSheet();setTimeout(()=>{const i=$('f-sub');i&&i.focus()},30);break}
    case 'sub-tog':{syncE();const x=E.subs[+el.dataset.i];if(x)x.d=!x.d;drawTaskSheet();break}
    case 'sub-del':{syncE();E.subs.splice(+el.dataset.i,1);drawTaskSheet();break}
    case 'theme':setTheme(v);render();break;
    case 'exp-csv':exportCSV();break;
    case 'exp-ics':exportICS();break;
    case 'sh-area':syncE();E.areaId=v;drawTaskSheet();break;
    case 'sh-imp':syncE();E.imp=+v;drawTaskSheet();break;
    case 'sh-time':{syncE();if(E.time)E.time=null;else{const h=(new Date().getHours()+1)%24;E.time=pad(h)+':00'}drawTaskSheet();break}
    case 'sh-rep':syncE();E.repeat={type:v,days:E.repeat.days||[]};drawTaskSheet();break;
    case 'sh-day':{syncE();const s=new Set(E.repeat.days||[]);s.has(+v)?s.delete(+v):s.add(+v);E.repeat.days=[...s].sort();drawTaskSheet();break}
    case 'sh-datepick':{syncE();const n=$('f-date-native');if(!n)break;n.value=E.date;try{n.showPicker?n.showPicker():n.click()}catch(err){n.click()}break}
    case 'sh-save':saveTask();break;
    case 'sh-cancel':closeSheet();break;
    case 'sh-del':{const id=E.id;confirmSheet('حذف هذه المهمة نهائياً؟','حذف',()=>{const t=S.tasks.find(x=>x.id===id);if(t)putTask({...t,del:true})});break}
    case 'area-new':areaSheet(null);break;
    case 'area-edit':areaSheet(el.dataset.id);break;
    case 'ar-icon':AE.name=$('a-name').value;AE.icon=v;drawAreaSheet();break;
    case 'ar-color':AE.name=$('a-name').value;AE.color=v;drawAreaSheet();break;
    case 'ar-save':saveArea();break;
    case 'ar-del':{const id=AE.id;confirmSheet('حذف هذا المجال؟ ستبقى مهامه دون مجال.','حذف',()=>{const x=S.areas.find(y=>y.id===id);if(x)putArea({...x,del:true})});break}
    case 'login':authDo('login');break;
    case 'signup':authDo('signup');break;
    case 'forgot':{const em=($('em')||{}).value;if(!em){$('auth-err').textContent='اكتب بريدك أولاً';break}
      sb.auth.resetPasswordForEmail(em.trim(),{redirectTo:location.href.split('#')[0]}).then(r=>toast(r.error?'تعذّر الإرسال':'أُرسل رابط الاستعادة إلى بريدك'));break}
    case 'chgpw':{const p=$('np').value;if(p.length<6){toast('كلمة المرور 6 أحرف على الأقل');break}
      sb.auth.updateUser({password:p}).then(r=>{toast(r.error?'تعذّر التغيير':'تم تغيير كلمة المرور');if(!r.error)$('np').value=''});break}
    case 'logout':sb.auth.signOut();break;
    case 'bn-done':toggleDone(el.dataset.id,el.dataset.d);$('banner').classList.remove('open');break;
    case 'bn-close':$('banner').classList.remove('open');break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.act==='datepick'&&t.value){V.date=t.value;V.base=V.date;render()}
  if(t.id==='p-date-native'&&t.value){const f=$('p-date');if(f)f.value=fmtDMY(t.value);const er=$('p-err');if(er)er.textContent=''}
  if(t.id==='f-date-native'&&t.value&&E){E.date=t.value;E.dateText=fmtDMY(t.value);const f=$('f-date');if(f)f.value=E.dateText;const er=$('f-date-err');if(er)er.textContent=''}
});
/* إدخال التاريخ: أرقام فقط مع إضافة الشرطات تلقائياً بصيغة DD/MM/YYYY */
document.addEventListener('input',e=>{
  if(e.target.id==='q'){V.q=e.target.value;const r=$('sr');if(r)r.innerHTML=searchResults();return}
  if(e.target.id!=='f-date'&&e.target.id!=='p-date')return;
  const d=e.target.value.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/\D/g,'').slice(0,8);
  e.target.value=d.length>4?`${d.slice(0,2)}/${d.slice(2,4)}/${d.slice(4)}`:d.length>2?`${d.slice(0,2)}/${d.slice(2)}`:d;
  const er=$('f-date-err')||$('p-err');if(er)er.textContent='';
});
$('fab').addEventListener('click',()=>taskSheet(null));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  if(e.key==='Enter'&&E&&e.target.id==='f-title'){e.preventDefault();saveTask()}
  if(e.key==='Enter'&&E&&e.target.id==='f-sub'){e.preventDefault();syncE();addSubFromDraft();drawTaskSheet();setTimeout(()=>{const i=$('f-sub');i&&i.focus()},30)}
  if(e.key==='Enter'&&PS&&e.target.id==='p-date'){e.preventDefault();savePostpone()}
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){render(true);if(sb&&session){pull().then(()=>{save();render(true);push()}).catch(()=>setSync('err'))}}
});
window.addEventListener('online',()=>{if(session)push()});
window.addEventListener('offline',()=>{if(session)setSync('err')});

/* ============ السحب: لليسار = تم، لليمين = تأجيل ============ */
let SW=null,swipedAt=0;
const SW_MIN=88;
document.addEventListener('touchstart',e=>{
  const w=e.target.closest('.swrap');if(!w||e.touches.length!==1||e.target.closest('.chk,.pp'))return;
  const t=e.touches[0];SW={w,card:w.querySelector('.task'),x:t.clientX,y:t.clientY,dx:0,axis:null};
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!SW)return;const t=e.touches[0],dx=t.clientX-SW.x,dy=t.clientY-SW.y;
  if(!SW.axis){if(Math.abs(dx)<10&&Math.abs(dy)<10)return;SW.axis=Math.abs(dx)>Math.abs(dy)?'x':'y'}
  if(SW.axis!=='x'){SW=null;return}
  e.preventDefault();
  let v=dx;if(v>0&&!SW.w.dataset.pp)v=Math.min(v,24); // لا تأجيل للمتكررة أو المنجزة
  SW.dx=v;SW.w.classList.add('drag');SW.w.classList.toggle('l',v<0);SW.w.classList.toggle('r',v>0);
  SW.card.style.transform=`translateX(${v}px)`;
},{passive:false});
document.addEventListener('touchend',()=>{
  if(!SW)return;const {w,card,dx}=SW;SW=null;w.classList.remove('drag');
  if(Math.abs(dx)>8)swipedAt=Date.now();
  const id=w.dataset.id,d=w.dataset.d;
  if(dx<=-SW_MIN){w.classList.add('go');card.style.transform='translateX(-110%)';setTimeout(()=>toggleDone(id,d),180);return}
  card.style.transform='';w.classList.remove('l','r');
  if(dx>=SW_MIN&&w.dataset.pp)postponeSheet(id);
});
document.addEventListener('touchcancel',()=>{if(SW){SW.card.style.transform='';SW.w.classList.remove('drag','l','r');SW=null}});
/* ============ الشريط المصغّر عند التمرير ============ */
function updateMinibar(){const h=document.querySelector('.hero');const on=V.tab!=='search'&&h&&h.getBoundingClientRect().bottom<0;$('minibar').classList.toggle('on',!!on);$('minibar').setAttribute('aria-hidden',on?'false':'true')}
window.addEventListener('scroll',updateMinibar,{passive:true});
/* ============ بدء التشغيل ============ */
document.querySelectorAll('.nav button[data-ic]').forEach(b=>b.insertAdjacentHTML('afterbegin',ic(b.dataset.ic,'l')));
$('fab').innerHTML=ic('plus');
render();
initSB();
checkReminders();
setInterval(checkReminders,20000);
setInterval(()=>{if(session)push()},60000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
